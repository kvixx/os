# Параметры модели (генерируются один раз при запуске)
[model]
memory_min = 1024
memory_max = 4096
process_table_size = 8   # число слотов в таблице PSW
random_seed = 14         # зерно ГПСЧ

# Параметры заданий (генерируются для каждого нового задания)
[task]
size_min = 96            # размер задания, ед. памяти
size_max = 384
commands_min = 16        # N_cmnd — число команд задания
commands_max = 48
io_percent_min = 10      # D_InOut — доля команд ввода-вывода, %
io_percent_max = 30
io_duration = 6          # N_InOut — длительность команды ввода-вывода, тактов
error_percent = 2        # доля ошибочных команд, %

# Параметры аппаратной (операндной) памяти
[memory]
words = 64               # число слов памяти

# Параметры процессоров ввода-вывода
# Процессоров достаточно для работы без очередей (допущение работы)
[io]
processors = 8

# Параметры супервизора времени
# Вариант 1: FIFO (без приоритетов), три центральных процессора.
[scheduler]
cpu_count = 3            # число центральных процессоров
algorithm = "FIFO"       # дисциплина диспетчеризации
