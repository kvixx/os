# Параметры модели (генерируются один раз при запуске)
[model]
memory_min = 1024
memory_max = 4096
process_table_size = 8   # число слотов в таблице PSW
random_seed = 14         # зерно ГПСЧ

# Параметры заданий (генерируются для каждого нового задания)
[task]
size_min = 96
size_max = 384

# Параметры супервизора времени
# Вариант 1: FIFO (без приоритетов), три центральных процессора.
[scheduler]
cpu_count = 3            # число центральных процессоров
algorithm = "FIFO"       # дисциплина диспетчеризации
